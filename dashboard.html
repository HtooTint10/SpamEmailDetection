<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - SpamGuard AI</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(91, 55, 232, .13),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(49, 85, 237, .12),
                    transparent 30%
                ),
                #070914;

            color: #f4f6ff;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            border: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================================================
           BACKGROUND
        ========================================================= */

        .ambient {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -3;
            opacity: .5;
        }

        .ambient-one {
            width: 420px;
            height: 420px;
            left: -180px;
            top: 80px;

            background: rgba(91, 55, 232, .22);

            animation:
                ambientMoveOne
                12s
                ease-in-out
                infinite;
        }

        .ambient-two {
            width: 380px;
            height: 380px;
            right: -150px;
            top: 300px;

            background: rgba(49, 85, 237, .20);

            animation:
                ambientMoveTwo
                15s
                ease-in-out
                infinite;
        }

        .ambient-three {
            width: 300px;
            height: 300px;
            left: 45%;
            bottom: -180px;

            background: rgba(117, 75, 255, .14);

            animation:
                ambientMoveThree
                13s
                ease-in-out
                infinite;
        }

        .grid-background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: -2;

            opacity: .25;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 92%
                );
        }

        @keyframes ambientMoveOne {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(70px, 40px);
            }
        }

        @keyframes ambientMoveTwo {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-70px, 70px);
            }
        }

        @keyframes ambientMoveThree {
            0%, 100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(100px);
            }
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            width: min(1380px, calc(100% - 40px));
            min-height: 70px;

            position: sticky;
            top: 18px;
            z-index: 100;

            margin: 18px auto 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px 0 20px;

            background: rgba(10, 13, 29, .78);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 18px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.04);

            animation:
                headerDrop
                .7s
                ease
                both;
        }

        @keyframes headerDrop {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           LOGO
        ========================================================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;

            color: #fff;

            font-size: 18px;
            font-weight: 750;

            letter-spacing: -.3px;
        }

        .logo-icon-wrap {
            position: relative;
        }

        .logo-icon {
            width: 39px;
            height: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #3155ed,
                    #713cf1
                );

            box-shadow:
                0 0 25px rgba(91,55,232,.35),
                inset 0 1px 0 rgba(255,255,255,.2);

            transition: .25s ease;
        }

        .logo:hover .logo-icon {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(91,55,232,.55),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        .blue {
            color: #7187ff;
        }

        /* =========================================================
           NEW MAIL INDICATOR
        ========================================================= */

        .new-mail-dot {
            position: absolute;

            width: 11px;
            height: 11px;

            right: -2px;
            top: -2px;

            border-radius: 50%;

            background: #ff4f67;

            border:
                2px solid
                #0b0e20;

            box-shadow:
                0 0 0 0 rgba(255,79,103,.65),
                0 0 12px rgba(255,79,103,.85);

            display: none;

            animation:
                newMailPulse
                1.5s
                infinite;
        }

        .new-mail-dot.show {
            display: block;
        }

        @keyframes newMailPulse {
            0% {
                box-shadow:
                    0 0 0 0 rgba(255,79,103,.65),
                    0 0 12px rgba(255,79,103,.85);
            }

            70% {
                box-shadow:
                    0 0 0 8px rgba(255,79,103,0),
                    0 0 18px rgba(255,79,103,.95);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(255,79,103,0),
                    0 0 12px rgba(255,79,103,.85);
            }
        }

        .new-mail-count {
            position: absolute;

            min-width: 18px;
            height: 18px;

            right: -9px;
            top: -11px;

            padding: 0 5px;

            display: none;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #ff4f67;
            color: #fff;

            border:
                2px solid
                #0b0e20;

            font-size: 9px;
            font-weight: 800;

            z-index: 5;

            box-shadow:
                0 5px 15px rgba(255,79,103,.35);
        }

        .new-mail-count.show {
            display: flex;
        }

        /* =========================================================
           HEADER RIGHT
        ========================================================= */

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .account-badge {
            max-width: 330px;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 11px;

            background:
                rgba(255,255,255,.045);

            color: #d9ddf0;

            font-size: 12px;
            font-weight: 600;

            transition: .25s ease;
        }

        .account-badge:hover {
            border-color:
                rgba(113,135,255,.4);

            background:
                rgba(113,135,255,.08);
        }

        .account-badge i {
            color: #6f83ff;
        }

        .account-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 9px 13px;

            border:
                1px solid
                rgba(255,100,100,.2);

            border-radius: 10px;

            background:
                rgba(255,75,75,.07);

            color: #ff8585;

            font-size: 12px;
            font-weight: 650;

            transition: .25s ease;
        }

        .logout-btn:hover {
            color: #fff;

            background:
                rgba(255,75,75,.17);

            border-color:
                rgba(255,100,100,.4);

            transform: translateY(-2px);
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: min(1380px, calc(100% - 40px));

            margin: 0 auto;

            padding: 55px 0 80px;
        }

        /* =========================================================
           PAGE TITLE
        ========================================================= */

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            gap: 25px;

            margin-bottom: 30px;

            animation:
                fadeUp
                .7s
                ease
                .1s
                both;
        }

        .page-title h1 {
            margin-bottom: 9px;

            font-size:
                clamp(
                    30px,
                    4vw,
                    43px
                );

            line-height: 1.05;

            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 20%,
                    #a8b7ff 55%,
                    #7956f5 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .page-title p {
            color: #8d96b2;
            font-size: 14px;
        }

        /* =========================================================
           STATS
        ========================================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 28px;
        }

        .card {
            position: relative;
            overflow: hidden;

            min-height: 125px;

            padding: 23px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,24,48,.88),
                    rgba(10,13,29,.76)
                );

            box-shadow:
                0 18px 50px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.035);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition: .3s ease;

            animation:
                fadeUp
                .7s
                ease
                .2s
                both;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            right: -55px;
            top: -65px;

            border-radius: 50%;

            background:
                rgba(91,55,232,.12);

            filter: blur(25px);
        }

        .card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(113,135,255,.22);

            box-shadow:
                0 25px 65px rgba(0,0,0,.28),
                0 0 35px rgba(80,60,220,.08);
        }

        .stat-title {
            color: #7f89a6;

            font-size: 12px;
            font-weight: 600;

            margin-bottom: 11px;
        }

        .stat-number {
            font-size: 34px;
            line-height: 1;

            font-weight: 750;

            color: #f8f9ff;
        }

        .stat-number.safe {
            color: #48d99a;
        }

        .stat-number.spam {
            color: #ff6875;
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 17px;

            animation:
                fadeUp
                .7s
                ease
                .3s
                both;
        }

        .filters {
            display: flex;
            gap: 5px;

            padding: 5px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 13px;

            background:
                rgba(13,16,34,.72);

            backdrop-filter: blur(12px);

            overflow-x: auto;
        }

        .filter-btn {
            display: flex;
            align-items: center;

            gap: 7px;

            padding: 9px 14px;

            border-radius: 9px;

            background: transparent;

            color: #7f89a6;

            cursor: pointer;

            white-space: nowrap;

            font-size: 12px;
            font-weight: 650;

            transition: .25s ease;
        }

        .filter-btn:hover {
            color: #dce2ff;

            background:
                rgba(255,255,255,.05);
        }

        .filter-btn.active {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #3155ed,
                    #673be8
                );

            box-shadow:
                0 5px 18px
                rgba(73,65,225,.25);
        }

        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 11px 18px;

            border-radius: 11px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #3155ed,
                    #713cf1
                );

            box-shadow:
                0 8px 25px
                rgba(66,59,220,.25);

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;

            transition: .25s ease;
        }

        .scan-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 32px
                rgba(66,59,220,.38);
        }

        .scan-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================================
           NEW MAIL BUTTON
        ========================================================= */

        .new-mail-btn {
            display: none;

            align-items: center;
            gap: 7px;

            padding: 10px 14px;

            border-radius: 10px;

            color: #fff;

            background:
                rgba(255,79,103,.10);

            border:
                1px solid
                rgba(255,79,103,.22);

            cursor: pointer;

            font-size: 11px;
            font-weight: 700;

            animation:
                newButtonPulse
                1.8s
                infinite;
        }

        .new-mail-btn.show {
            display: inline-flex;
        }

        .new-mail-btn:hover {
            background:
                rgba(255,79,103,.18);
        }

        @keyframes newButtonPulse {
            0%, 100% {
                box-shadow:
                    0 0 0
                    rgba(255,79,103,0);
            }

            50% {
                box-shadow:
                    0 0 25px
                    rgba(255,79,103,.15);
            }
        }

        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            display: none;

            margin-bottom: 13px;

            color: #8594ff;

            font-size: 12px;

            text-align: right;
        }

        .loading i {
            margin-right: 5px;
        }

        /* =========================================================
           EMAIL SECTION
        ========================================================= */

        .email-section {
            position: relative;
            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,22,44,.90),
                    rgba(9,12,27,.88)
                );

            box-shadow:
                0 25px 75px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.035);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            animation:
                fadeUp
                .7s
                ease
                .4s
                both;
        }

        .email-section::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 180px;

            left: 25%;
            top: -160px;

            background:
                rgba(86,68,235,.14);

            filter: blur(60px);

            pointer-events: none;
        }

        .section-head {
            position: relative;

            min-height: 67px;

            padding: 17px 22px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .section-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-head h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .section-count {
            padding: 4px 8px;

            border-radius: 20px;

            color: #9ca8ff;

            background:
                rgba(91,105,255,.10);

            border:
                1px solid
                rgba(100,110,255,.14);

            font-size: 10px;
            font-weight: 700;
        }

        .account-inline {
            color: #7588ff;

            font-size: 12px;
            font-weight: 650;
        }

        /* =========================================================
           NEW MAIL BANNER
        ========================================================= */

        .new-mail-banner {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 9px 15px;

            color: #dce2ff;

            background:
                linear-gradient(
                    90deg,
                    rgba(78,83,230,.10),
                    rgba(255,79,103,.08),
                    rgba(78,83,230,.10)
                );

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

            font-size: 11px;
            font-weight: 650;

            cursor: pointer;
        }

        .new-mail-banner.show {
            display: flex;
        }

        .new-mail-banner i {
            color: #ff5d73;
        }

        .new-mail-banner strong {
            color: #fff;
        }

        /* =========================================================
           MAILBOX BADGE
        ========================================================= */

        .mailbox-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            margin-top: 8px;

            width: max-content;

            padding: 4px 8px;

            border-radius: 20px;

            font-size: 9px;
            font-weight: 750;

            letter-spacing: .2px;
        }

        .mailbox-badge.inbox {
            color: #7f9bff;

            background:
                rgba(74,98,255,.09);

            border:
                1px solid
                rgba(90,110,255,.14);
        }

        .mailbox-badge.spam {
            color: #ff7883;

            background:
                rgba(255,75,85,.09);

            border:
                1px solid
                rgba(255,75,85,.14);
        }

        .mailbox-badge.other {
            color: #9ca5bb;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        /* =========================================================
           EMAIL ROW
        ========================================================= */

        .email-row {
            position: relative;

            padding: 18px 22px;

            display: grid;

            grid-template-columns:
                minmax(240px, 1fr)
                115px
                140px
                330px;

            gap: 17px;

            align-items: center;

            border-bottom:
                1px solid
                rgba(255,255,255,.055);

            transition: .25s ease;
        }

        .email-row:last-child {
            border-bottom: 0;
        }

        .email-row:hover {
            background:
                linear-gradient(
                    90deg,
                    rgba(75,74,210,.08),
                    rgba(75,74,210,.025)
                );
        }

        .email-row.new-email {
            background:
                linear-gradient(
                    90deg,
                    rgba(67,82,225,.10),
                    rgba(255,79,103,.045)
                );

            border-left:
                2px solid
                #ff5d73;
        }

        .email-row.new-email::before {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            left: 8px;
            top: 21px;

            border-radius: 50%;

            background: #ff5d73;

            box-shadow:
                0 0 10px #ff5d73;
        }

        .email-main {
            min-width: 0;
        }

        .subject-line {
            display: flex;
            align-items: center;

            gap: 8px;

            min-width: 0;
        }

        .subject {
            color: #eef0fb;

            font-size: 13px;
            font-weight: 650;

            margin-bottom: 5px;

            word-break: break-word;
        }

        .sender {
            color: #77829e;

            font-size: 11px;

            word-break: break-word;
        }

        .new-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            padding: 3px 7px;

            border-radius: 20px;

            background:
                rgba(255,79,103,.12);

            border:
                1px solid
                rgba(255,79,103,.20);

            color: #ff7385;

            font-size: 8px;
            font-weight: 800;

            letter-spacing: .5px;
        }

        /* =========================================================
           RESULT
        ========================================================= */

        .result {
            width: max-content;
            min-width: 82px;

            margin: auto;

            padding: 6px 11px;

            border-radius: 30px;

            text-align: center;

            font-size: 10px;
            font-weight: 750;

            letter-spacing: .3px;
        }

        .result.safe {
            color: #4be09b;

            background:
                rgba(55,211,137,.10);

            border:
                1px solid
                rgba(55,211,137,.15);
        }

        .result.spam {
            color: #ff6d78;

            background:
                rgba(255,75,85,.10);

            border:
                1px solid
                rgba(255,75,85,.15);
        }

        .result.unscanned {
            color: #8b94a9;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        .confidence {
            color: #7d87a1;

            font-size: 11px;

            text-align: center;
        }

        /* =========================================================
           ACTIONS
        ========================================================= */

        .actions {
            display: flex;
            justify-content: flex-end;

            gap: 7px;

            flex-wrap: wrap;
        }

        .action {
            display: inline-flex;
            align-items: center;

            gap: 5px;

            padding: 7px 10px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 10px;
            font-weight: 650;

            transition: .22s ease;
        }

        .action:hover {
            transform: translateY(-1px);
        }

        .action:disabled {
            opacity: .55;

            cursor: not-allowed;

            transform: none;
        }

        .scan-one,
        .details {
            color: #8798ff;

            background:
                rgba(69,83,220,.10);

            border:
                1px solid
                rgba(100,110,255,.12);
        }

        .scan-one:hover,
        .details:hover {
            background:
                rgba(69,83,220,.18);
        }

        .move-spam {
            color: #ff727c;

            background:
                rgba(255,75,85,.08);

            border:
                1px solid
                rgba(255,75,85,.12);
        }

        .move-spam:hover {
            background:
                rgba(255,75,85,.16);
        }

        .move-safe {
            color: #4bdfa0;

            background:
                rgba(55,211,137,.08);

            border:
                1px solid
                rgba(55,211,137,.12);
        }

        .move-safe:hover {
            background:
                rgba(55,211,137,.16);
        }

        /* =========================================================
           EMPTY
        ========================================================= */

        .empty {
            min-height: 280px;

            padding: 65px 20px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #77829d;
        }

            margin-bottom: 17px;

            color: #687eff;

            filter:
                drop-shadow(

        }

        .empty p {
            max-width: 500px;

            font-size: 12px;

            line-height: 1.6;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            max-width: 430px;

            padding: 13px 17px;

            display: none;

            z-index: 9999;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 12px;

            background:
                linear-gradient(

                    rgba(26,31,58,.96),

            box-shadow:
                0 20px 60px rgba(0,0,0,.4),

            font-size: 12px;

            backdrop-filter: blur(15px);

            animation:
                toastIn

                ease;
        }

        .toast.new-toast {

                rgba(255,79,103,.25);

            box-shadow:
                0 20px 60px rgba(0,0,0,.4),
                0 0 30px rgba(255,79,103,.13);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1150px) {

            .email-row {

                    100px

        @media (max-width: 850px) {

</head>

<body>

                    </strong>

                    new email(s) received

            <div id="results">

                <div class="empty">

                    <i class="fa-solid fa-spinner fa-spin"></i>

    <!-- =========================================================
         TOAST
    ========================================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <script>

        /* =========================================================
           STORAGE
        ========================================================= */

        const INBOX_STORAGE_KEY =
            "spamguard_inbox_v6";

        const SCAN_STORAGE_KEY =
            "spamguard_scan_results_v6";

        const ACCOUNT_STORAGE_KEY =
            "spamguard_account_v6";


        const OLD_CACHE_KEYS = [

            "spamguard_inbox_v5",
            "spamguard_scan_results_v5",
            "spamguard_account_v5",

            "spamguard_inbox_v4",
            "spamguard_scan_results_v4",
            "spamguard_account_v4"

        ];


        /* =========================================================
           STATE
        ========================================================= */

        let inboxEmails = [];

        let allResults = [];

        let currentFilter = "all";

        let loadingInbox = false;

        let scanningAll = false;

        let refreshingInbox = false;

        let newEmailIds = new Set();

        let newMailCount = 0;

        let initialInboxLoaded = false;

        const INBOX_REFRESH_INTERVAL = 10000;


        /* =========================================================
           INITIAL LOAD
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                clearOldCacheVersions();

                restoreCachedDashboard();

                await ensureGmailInboxLoaded(true);

            }
        );


        /* =========================================================
           AUTO REFRESH
        ========================================================= */

        setInterval(
            async () => {

                if (
                    !scanningAll &&
                    !loadingInbox &&
                    !refreshingInbox
                ) {

                    await ensureGmailInboxLoaded(false);

                }

            },
            INBOX_REFRESH_INTERVAL
        );


        /* =========================================================
           CLEAR OLD CACHE
        ========================================================= */

        function clearOldCacheVersions() {

            OLD_CACHE_KEYS.forEach(
                key => {

                    try {

                        localStorage.removeItem(
                            key
                        );

                    } catch (error) {

                        console.warn(
                            "Could not remove old cache:",
                            key
                        );

                    }

                }
            );

        }


        /* =========================================================
           GMAIL REFRESH
        ========================================================= */

        async function ensureGmailInboxLoaded(
            firstLoad = false
        ) {

            if (
                loadingInbox ||
                refreshingInbox ||
                scanningAll
            ) {

                return;

            }


            if (firstLoad) {

                loadingInbox = true;

            } else {

                refreshingInbox = true;

            }


            const previousIds =
                new Set(
                    inboxEmails.map(
                        email =>
                            String(email.id)
                    )
                );


            try {

                /* =================================================
                   ACCOUNT
                ================================================= */

                const accountResponse =
                    await fetch(
                        "/gmail-account",
                        {
                            cache: "no-store"
                        }
                    );


                const accountData =
                    await accountResponse.json();


                if (
                    !accountResponse.ok ||
                    !accountData.success
                ) {

                    throw new Error(
                        accountData.error ||
                        "Gmail is not connected."
                    );

                }


                const account =
                    accountData.email ||
                    "Gmail";


                /* =================================================
                   ACCOUNT CHANGE
                ================================================= */

                const oldAccount =
                    localStorage.getItem(
                        ACCOUNT_STORAGE_KEY
                    );


                if (
                    oldAccount &&
                    oldAccount !== account
                ) {

                    inboxEmails = [];

                    allResults = [];

                    newEmailIds =
                        new Set();

                    newMailCount = 0;

                    localStorage.removeItem(
                        INBOX_STORAGE_KEY
                    );

                    localStorage.removeItem(
                        SCAN_STORAGE_KEY
                    );

                }


                setAccount(account);


                /* =================================================
                   GET BOTH REAL GMAIL LOCATIONS
                   /gmail-inbox returns Inbox + Spam
                ================================================= */

                const response =
                    await fetch(
                        "/gmail-inbox",
                        {
                            cache: "no-store"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to load Gmail."
                    );

                }


                const gmailEmails =
                    Array.isArray(data.emails)
                        ? data.emails
                        : [];


                /* =================================================
                   DETECT NEW MESSAGES
                ================================================= */

                const detectedNewIds =
                    new Set();


                if (initialInboxLoaded) {

                    gmailEmails.forEach(
                        email => {

                            const id =
                                String(email.id);


                            if (
                                !previousIds.has(id)
                            ) {

                                detectedNewIds.add(id);

                            }

                        }
                    );

                }


                /* =================================================
                   PRESERVE OLD SCANS
                ================================================= */

                const previousById =
                    new Map(
                        inboxEmails.map(
                            email => [
                                String(email.id),
                                email
                            ]
                        )
                    );


                /* =================================================
                   BUILD FRESH GMAIL DATA
                ================================================= */

                inboxEmails =
                    gmailEmails.map(
                        email => {

                            const id =
                                String(email.id);


                            const old =
                                previousById.get(id);


                            /*
                             * IMPORTANT:
                             *
                             * Always use the NEW Gmail response
                             * for:
                             *
                             * mailbox
                             * gmail_label
                             * is_gmail_spam
                             *
                             * This prevents a moved message from
                             * keeping stale folder information.
                             */


                            if (
                                old &&
                                old.scanned === true &&
                                (
                                    old.is_spam === true ||
                                    old.is_spam === false
                                )
                            ) {

                                return {

                                    ...email,

                                    scanned: true,

                                    is_spam:
                                        old.is_spam,

                                    confidence:
                                        old.confidence,

                                    label:
                                        old.label,

                                    model:
                                        old.model,

                                    model_name:
                                        old.model_name,

                                    model_accuracy:
                                        old.model_accuracy,

                                    is_new:
                                        newEmailIds.has(id) ||
                                        detectedNewIds.has(id)

                                };

                            }


                            return {

                                ...email,

                                scanned: false,

                                is_spam: undefined,

                                confidence: undefined,

                                label: undefined,

                                model: undefined,

                                model_name: undefined,

                                model_accuracy: undefined,

                                is_new:
                                    newEmailIds.has(id) ||
                                    detectedNewIds.has(id)

                            };

                        }
                    );


                /* =================================================
                   NEW MESSAGE IDS
                ================================================= */

                detectedNewIds.forEach(
                    id => {

                        newEmailIds.add(id);

                    }
                );


                const currentIds =
                    new Set(
                        inboxEmails.map(
                            email =>
                                String(email.id)
                        )
                    );


                newEmailIds =
                    new Set(
                        [...newEmailIds]
                            .filter(
                                id =>
                                    currentIds.has(
                                        String(id)
                                    )
                            )
                    );


                newMailCount =
                    newEmailIds.size;


                /* =================================================
                   KEEP ONLY VALID SCANS
                ================================================= */

                allResults =
                    allResults.filter(
                        result => {

                            return (

                                result &&

                                result.id != null &&

                                result.scanned === true &&

                                (
                                    result.is_spam === true ||
                                    result.is_spam === false
                                ) &&

                                currentIds.has(
                                    String(result.id)
                                )

                            );

                        }
                    );


                /* =================================================
                   MERGE SCANS
                ================================================= */

                mergeScansIntoInbox();


                /* =================================================
                   UI
                ================================================= */

                updateNewMailIndicator();

                updateStatistics();

                renderResults();

                updateSectionCount();

                persistDashboard();


                initialInboxLoaded = true;


                if (
                    detectedNewIds.size > 0
                ) {

                    showNewMailToast(
                        detectedNewIds.size
                    );

                }

            } catch (error) {

                console.error(
                    "Gmail refresh error:",
                    error
                );


                if (
                    firstLoad &&
                    !inboxEmails.length
                ) {

                    const results =
                        document.getElementById(
                            "results"
                        );


                    if (results) {

                        results.innerHTML = `

                            <div class="empty">

                                <i class="fa-solid fa-circle-exclamation"></i>

                                <h3>
                                    Unable to load Gmail
                                </h3>

                                <p>
                                    ${escapeHtml(
                                        error.message
                                    )}
                                </p>

                            </div>

                        `;

                    }

                }

            } finally {

                loadingInbox = false;

                refreshingInbox = false;

            }

        }


        /* =========================================================
           ACCOUNT
        ========================================================= */

        function setAccount(account) {

            const safe =
                account ||
                "Gmail";


            const accountElement =
                document.getElementById(
                    "account"
                );


            const headerAccountElement =
                document.getElementById(
                    "headerAccount"
                );


            if (accountElement) {

                accountElement.textContent =
                    safe;

            }


            if (headerAccountElement) {

                headerAccountElement.textContent =
                    safe;

            }


            localStorage.setItem(
                ACCOUNT_STORAGE_KEY,
                safe
            );

        }


        /* =========================================================
           RESTORE CACHE
        ========================================================= */

        function restoreCachedDashboard() {

            try {

                const account =
                    localStorage.getItem(
                        ACCOUNT_STORAGE_KEY
                    );


                if (account) {

                    setAccount(account);

                }


                const savedInbox =
                    JSON.parse(
                        localStorage.getItem(
                            INBOX_STORAGE_KEY
                        ) || "null"
                    );


                const savedScans =
                    JSON.parse(
                        localStorage.getItem(
                            SCAN_STORAGE_KEY
                        ) || "null"
                    );


                if (
                    savedInbox &&
                    Array.isArray(
                        savedInbox.emails
                    )
                ) {

                    inboxEmails =
                        savedInbox.emails.map(
                            email => {

                                const scanned =
                                    email.scanned === true &&
                                    (
                                        email.is_spam === true ||
                                        email.is_spam === false
                                    );


                                if (scanned) {

                                    return {

                                        ...email,

                                        scanned: true,

                                        is_new: false

                                    };

                                }


                                return {

                                    ...email,

                                    scanned: false,

                                    is_spam: undefined,

                                    confidence: undefined,

                                    label: undefined,

                                    model: undefined,

                                    model_name: undefined,

                                    model_accuracy: undefined,

                                    is_new: false

                                };

                            }
                        );

                }


                if (
                    savedScans &&
                    Array.isArray(
                        savedScans.results
                    )
                ) {

                    allResults =
                        savedScans.results.filter(
                            result => {

                                return (

                                    result &&

                                    result.id != null &&

                                    result.scanned === true &&

                                    (
                                        result.is_spam === true ||
                                        result.is_spam === false
                                    )

                                );

                            }
                        );

                }


                mergeScansIntoInbox();


                newEmailIds =
                    new Set();

                newMailCount = 0;


                updateNewMailIndicator();

                updateStatistics();

                renderResults();

                updateSectionCount();


            } catch (error) {

                console.error(
                    "Cache restore error:",
                    error
                );

            }

        }


        /* =========================================================
           SAVE CACHE
        ========================================================= */

        function persistDashboard() {

            try {

                const account =
                    document.getElementById(
                        "account"
                    )?.textContent ||
                    "Gmail";


                localStorage.setItem(
                    ACCOUNT_STORAGE_KEY,
                    account
                );


                localStorage.setItem(
                    INBOX_STORAGE_KEY,
                    JSON.stringify({
                        email: account,
                        emails: inboxEmails
                    })
                );


                localStorage.setItem(
                    SCAN_STORAGE_KEY,
                    JSON.stringify({
                        email: account,
                        results: allResults
                    })
                );


            } catch (error) {

                console.error(
                    "Cache save error:",
                    error
                );

            }

        }


        /* =========================================================
           CLEAR CACHE
        ========================================================= */

        function clearDashboardCache() {

            try {

                localStorage.removeItem(
                    INBOX_STORAGE_KEY
                );

                localStorage.removeItem(
                    SCAN_STORAGE_KEY
                );

                localStorage.removeItem(
                    ACCOUNT_STORAGE_KEY
                );


                OLD_CACHE_KEYS.forEach(
                    key => {

                        localStorage.removeItem(
                            key
                        );

                    }
                );


                sessionStorage.clear();

            } catch (error) {

                console.warn(
                    "Could not clear dashboard cache:",
                    error
                );

            }

        }


        /* =========================================================
           MERGE SCANS
        ========================================================= */

        function mergeScansIntoInbox() {

            const validResults =
                allResults.filter(
                    result => {

                        return (

                            result &&

                            result.id != null &&

                            result.scanned === true &&

                            (
                                result.is_spam === true ||
                                result.is_spam === false
                            )

                        );

                    }
                );


            const byId =
                new Map(
                    validResults.map(
                        result => [
                            String(result.id),
                            result
                        ]
                    )
                );


            inboxEmails =
                inboxEmails.map(
                    email => {

                        const result =
                            byId.get(
                                String(email.id)
                            );


                        /*
                         * Scan exists.
                         *
                         * Keep Gmail location from
                         * the current Gmail response.
                         */

                        if (
                            result &&
                            result.scanned === true &&
                            (
                                result.is_spam === true ||
                                result.is_spam === false
                            )
                        ) {

                            return {

                                ...email,

                                scanned: true,

                                is_spam:
                                    result.is_spam,

                                confidence:
                                    result.confidence,

                                label:
                                    result.label,

                                model:
                                    result.model,

                                model_name:
                                    result.model_name,

                                model_accuracy:
                                    result.model_accuracy

                            };

                        }


                        /*
                         * No valid SVM result.
                         */

                        return {

                            ...email,

                            scanned: false,

                            is_spam: undefined,

                            confidence: undefined,

                            label: undefined,

                            model: undefined,

                            model_name: undefined,

                            model_accuracy: undefined

                        };

                    }
                );

        }


        /* =========================================================
           FILTER
        ========================================================= */

        function setFilter(
            filter,
            button
        ) {

            currentFilter =
                filter;


            document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


            if (button) {

                button.classList.add(
                    "active"
                );

            }


            renderResults();

            updateSectionCount();

        }


        /* =========================================================
           GET GMAIL MAILBOX
        ========================================================= */

        function getMailbox(email) {

            const mailbox =
                String(
                    email?.mailbox ||
                    ""
                ).toLowerCase();


            if (mailbox === "spam") {

                return "spam";

            }


            if (mailbox === "inbox") {

                return "inbox";

            }


            const label =
                String(
                    email?.gmail_label ||
                    ""
                ).toUpperCase();


            if (label === "SPAM") {

                return "spam";

            }


            if (label === "INBOX") {

                return "inbox";

            }


            return "other";

        }


        /* =========================================================
           FILTER EMAILS
        ========================================================= */

        function getFilteredEmails() {

            if (
                currentFilter === "gmail-inbox"
            ) {

                return inboxEmails.filter(
                    email =>
                        getMailbox(email) ===
                        "inbox"
                );

            }


            if (
                currentFilter === "gmail-spam"
            ) {

                return inboxEmails.filter(
                    email =>
                        getMailbox(email) ===
                        "spam"
                );

            }


            if (
                currentFilter === "spam"
            ) {

                return inboxEmails.filter(
                    email =>

                        email.scanned === true &&

                        email.is_spam === true

                );

            }


            if (
                currentFilter === "safe"
            ) {

                return inboxEmails.filter(
                    email =>

                        email.scanned === true &&

                        email.is_spam === false

                );

            }


            return inboxEmails;

        }


        /* =========================================================
           RENDER
        ========================================================= */

        function renderResults() {

            const container =
                document.getElementById(
                    "results"
                );


            if (!container) {

                return;

            }


            const filtered =
                getFilteredEmails();


            if (!filtered.length) {

                container.innerHTML = `

                    <div class="empty">

                        <i class="fa-solid fa-envelope-open-text"></i>

                        <h3>
                            No emails found
                        </h3>

                        <p>
                            No emails match the current filter.
                        </p>

                    </div>

                `;

                updateSectionCount();

                return;

            }


            container.innerHTML = "";


            filtered.forEach(
                email => {

                    /*
                     * STRICT SVM CHECK.
                     */

                    const scanned =
                        email.scanned === true &&
                        (
                            email.is_spam === true ||
                            email.is_spam === false
                        );


                    let resultClass =
                        "unscanned";


                    let label =
                        "NOT SCANNED";


                    let confidence =
                        "—";


                    if (scanned) {

                        resultClass =
                            email.is_spam === true
                                ? "spam"
                                : "safe";


                        label =
                            email.is_spam === true
                                ? "SPAM"
                                : "SAFE";


                        confidence =
                            `${
                                email.confidence ??
                                0
                            }% confidence`;

                    }


                    /*
                     * Gmail physical location.
                     */

                    const mailbox =
                        getMailbox(email);


                    let mailboxLabel =
                        "Other";


                    let mailboxIcon =
                        "fa-envelope";


                    let mailboxClass =
                        "other";


                    if (
                        mailbox === "inbox"
                    ) {

                        mailboxLabel =
                            "Gmail Inbox";

                        mailboxIcon =
                            "fa-inbox";

                        mailboxClass =
                            "inbox";

                    }


                    if (
                        mailbox === "spam"
                    ) {

                        mailboxLabel =
                            "Gmail Spam";

                        mailboxIcon =
                            "fa-triangle-exclamation";

                        mailboxClass =
                            "spam";

                    }


                    /*
                     * NEW.
                     */

                    const isNew =
                        email.is_new === true;


                    const newBadge =
                        isNew
                            ? `

                                <span class="new-badge">
                                    NEW
                                </span>

                            `
                            : "";


                    /*
                     * SCAN.
                     */

                    const scanButton =
                        scanned
                            ? ""
                            : `

                                <button
                                    class="action scan-one"
                                    onclick="scanSingleEmail(
                                        '${escapeJs(email.id)}',
                                        this
                                    )"
                                >

                                    <i class="fa-solid fa-magnifying-glass"></i>

                                    Scan

                                </button>

                            `;


                    /*
                     * MOVE BUTTON.
                     *
                     * IMPORTANT:
                     *
                     * This is based ONLY on the
                     * REAL Gmail mailbox.
                     *
                     * NOT on SVM prediction.
                     */

                    let moveButton = "";


                    if (
                        mailbox === "inbox"
                    ) {

                        moveButton = `

                            <button
                                class="action move-spam"
                                onclick="moveToSpam(
                                    '${escapeJs(email.id)}'
                                )"
                            >

                                <i class="fa-solid fa-triangle-exclamation"></i>

                                Move to Spam

                            </button>

                        `;

                    }


                    if (
                        mailbox === "spam"
                    ) {

                        moveButton = `

                            <button
                                class="action move-safe"
                                onclick="moveToSafe(
                                    '${escapeJs(email.id)}'
                                )"
                            >

                                <i class="fa-solid fa-shield"></i>

                                Move to Safe

                            </button>

                        `;

                    }


                    /*
                     * ROW.
                     */

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "email-row" +
                        (
                            isNew
                                ? " new-email"
                                : ""
                        );


                    row.innerHTML = `

                        <div class="email-main">

                            <div class="subject-line">

                                <div class="subject">

                                    ${escapeHtml(
                                        email.subject ||
                                        "(No Subject)"
                                    )}

                                </div>

                                ${newBadge}

                            </div>


                            <div class="sender">

                                ${escapeHtml(
                                    email.sender ||
                                    "Unknown Sender"
                                )}

                            </div>


                            <div
                                class="mailbox-badge ${mailboxClass}"
                            >

                                <i
                                    class="fa-solid ${mailboxIcon}"
                                ></i>

                                ${mailboxLabel}

                            </div>

                        </div>


                        <div>

                            <div
                                class="result ${resultClass}"
                            >
                                ${label}
                            </div>

                        </div>


                        <div class="confidence">

                            ${confidence}

                        </div>


                        <div class="actions">

                            ${scanButton}


                            <button
                                class="action details"
                                onclick="viewDetails(
                                    '${escapeJs(email.id)}'
                                )"
                            >

                                <i class="fa-solid fa-eye"></i>

                                Details

                            </button>


                            ${moveButton}

                        </div>

                    `;


                    container.appendChild(
                        row
                    );

                }
            );


            updateSectionCount();

        }


        /* =========================================================
           SECTION COUNT
        ========================================================= */

        function updateSectionCount() {

            const countElement =
                document.getElementById(
                    "sectionCount"
                );


            if (!countElement) {

                return;

            }


            const filtered =
                getFilteredEmails();


            countElement.textContent =
                filtered.length;

        }


        /* =========================================================
           STATISTICS
        ========================================================= */

        function updateStatistics() {

            const scanned =
                inboxEmails.filter(
                    email =>

                        email.scanned === true &&

                        (
                            email.is_spam === true ||
                            email.is_spam === false
                        )
                );


            const total =
                document.getElementById(
                    "total"
                );


            const safe =
                document.getElementById(
                    "safe"
                );


            const spam =
                document.getElementById(
                    "spam"
                );


            if (total) {

                total.textContent =
                    scanned.length;

            }


            if (safe) {

                safe.textContent =
                    scanned.filter(
                        email =>
                            email.is_spam === false
                    ).length;

            }


            if (spam) {

                spam.textContent =
                    scanned.filter(
                        email =>
                            email.is_spam === true
                    ).length;

            }

        }
