        /* =========================================================
           SCAN ALL
        ========================================================= */

        async function scanGmail() {

            if (scanningAll) {

                return;

            }


            scanningAll = true;


            const button =
                document.getElementById(
                    "scanAllButton"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            if (button) {

                button.disabled = true;

                button.innerHTML = `

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Scanning...

                `;

            }


            if (loading) {

                loading.style.display =
                    "block";

            }


            try {

                const response =
                    await fetch(
                        "/scan-gmail?model=linear_svm",
                        {
                            cache: "no-store"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to scan Gmail."
                    );

                }


                setAccount(
                    data.email ||
                    "Gmail"
                );


                /*
                 * Only valid SVM classifications.
                 */

                allResults =
                    (data.results || [])

                        .filter(
                            result => {

                                return (

                                    result &&

                                    result.id != null &&

                                    (
                                        result.is_spam === true ||
                                        result.is_spam === false
                                    )

                                );

                            }
                        )

                        .map(
                            result => ({

                                ...result,

                                model:
                                    "linear_svm",

                                model_name:
                                    "Linear SVM",

                                model_accuracy:
                                    data.model_accuracy ??
                                    97.93,

                                scanned:
                                    true

                            })
                        );


                /*
                 * Merge predictions into
                 * the latest Gmail records.
                 */

                mergeScansIntoInbox();


                inboxEmails.forEach(
                    email => {

                        email.is_new = false;

                    }
                );


                newEmailIds.clear();

                newMailCount = 0;


                updateNewMailIndicator();

                updateStatistics();

                renderResults();

                updateSectionCount();

                persistDashboard();


                showToast(
                    `Scan complete: ${
                        data.total ??
                        allResults.length
                    } emails classified.`
                );


            } catch (error) {

                console.error(
                    "Scan Gmail error:",
                    error
                );


                showToast(
                    "Scan failed: " +
                    error.message
                );


            } finally {

                scanningAll = false;


                if (button) {

                    button.disabled = false;

                    button.innerHTML = `

                        <i class="fa-solid fa-magnifying-glass"></i>

                        Scan All Mails

                    `;

                }


                if (loading) {

                    loading.style.display =
                        "none";

                }

            }

        }


        /* =========================================================
           SCAN SINGLE EMAIL
        ========================================================= */

        async function scanSingleEmail(
            id,
            button
        ) {

            if (button) {

                button.disabled = true;

                button.innerHTML = `

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Scanning

                `;

            }


            try {

                const response =
                    await fetch(
                        "/scan-email/" +
                        encodeURIComponent(id) +
                        "?model=linear_svm",
                        {
                            method: "POST",
                            cache: "no-store"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success ||
                    !data.result
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to scan email."
                    );

                }


                const apiResult =
                    data.result;


                if (
                    apiResult.is_spam !== true &&
                    apiResult.is_spam !== false
                ) {

                    throw new Error(
                        "The scan did not return a valid classification."
                    );

                }


                const existingEmail =
                    inboxEmails.find(
                        email =>
                            String(email.id) ===
                            String(id)
                    );


                const result = {

                    ...apiResult,

                    /*
                     * Preserve real Gmail location
                     * from the dashboard record if
                     * the API does not provide it.
                     */

                    mailbox:
                        apiResult.mailbox ??
                        existingEmail?.mailbox,

                    gmail_label:
                        apiResult.gmail_label ??
                        existingEmail?.gmail_label,

                    is_gmail_spam:
                        apiResult.is_gmail_spam ??
                        existingEmail?.is_gmail_spam,

                    model:
                        "linear_svm",

                    model_name:
                        "Linear SVM",

                    model_accuracy:
                        apiResult.model_accuracy ??
                        97.93,

                    scanned:
                        true

                };


                const index =
                    allResults.findIndex(
                        item =>
                            String(item.id) ===
                            String(id)
                    );


                if (index >= 0) {

                    allResults[index] =
                        result;

                } else {

                    allResults.push(
                        result
                    );

                }


                if (existingEmail) {

                    existingEmail.is_new = false;

                }


                newEmailIds.delete(
                    String(id)
                );


                newMailCount =
                    newEmailIds.size;


                mergeScansIntoInbox();

                updateNewMailIndicator();

                updateStatistics();

                renderResults();

                updateSectionCount();

                persistDashboard();


                const resultLabel =
                    result.is_spam === true
                        ? "SPAM"
                        : "SAFE";


                showToast(
                    `${resultLabel} — ${
                        result.confidence ?? 0
                    }% confidence`
                );


            } catch (error) {

                console.error(
                    "Single scan error:",
                    error
                );


                showToast(
                    "Scan failed: " +
                    error.message
                );


            } finally {

                if (button) {

                    button.disabled = false;

                    button.innerHTML = `

                        <i class="fa-solid fa-magnifying-glass"></i>

                        Scan

                    `;

                }

            }

        }


        /* =========================================================
           VIEW DETAILS
        ========================================================= */

        function viewDetails(id) {

            const email =
                inboxEmails.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!email) {

                showToast(
                    "Email could not be found."
                );

                return;

            }


            const params =
                new URLSearchParams();


            const scanned =
                email.scanned === true &&
                (
                    email.is_spam === true ||
                    email.is_spam === false
                );


            params.set(
                "scanned",
                scanned
                    ? "1"
                    : "0"
            );


            if (scanned) {

                params.set(
                    "is_spam",
                    email.is_spam === true
                        ? "1"
                        : "0"
                );


                params.set(
                    "confidence",
                    email.confidence ?? "0"
                );

            }


            location.href =
                "/email-details/" +
                encodeURIComponent(id) +
                "?" +
                params.toString();

        }

        /* =========================================================
           MOVE EMAIL
        ========================================================= */

        async function moveEmail(
            id,
            url,
            successMessage
        ) {

            const email =
                inboxEmails.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!email) {

                showToast(
                    "Email could not be found."
                );

                return;

            }


            const mailbox =
                getMailbox(email);


            /*
             * Safety check.
             *
             * Prevent the wrong action from
             * being sent because of stale UI.
             */

            if (
                url.includes("/move-to-spam/") &&
                mailbox !== "inbox"
            ) {

                showToast(
                    "This email is no longer in Gmail Inbox."
                );

                await ensureGmailInboxLoaded(false);

                return;

            }


            if (
                url.includes("/move-to-safe/") &&
                mailbox !== "spam"
            ) {

                showToast(
                    "This email is no longer in Gmail Spam."
                );

                await ensureGmailInboxLoaded(false);

                return;

            }


            try {

                const response =
                    await fetch(
                        url +
                        encodeURIComponent(id),
                        {
                            method: "POST",
                            cache: "no-store"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Unable to move email."
                    );

                }


                /*
                 * IMPORTANT:
                 *
                 * The backend has already changed
                 * the REAL Gmail message.
                 *
                 * Update local mailbox immediately.
                 *
                 * Do NOT change the SVM result.
                 */

                const updatedEmail =
                    inboxEmails.find(
                        item =>
                            String(item.id) ===
                            String(id)
                    );


                if (updatedEmail) {

                    if (
                        data.mailbox === "spam"
                    ) {

                        updatedEmail.mailbox =
                            "spam";

                        updatedEmail.gmail_label =
                            "SPAM";

                        updatedEmail.is_gmail_spam =
                            true;

                    } else if (
                        data.mailbox === "inbox"
                    ) {

                        updatedEmail.mailbox =
                            "inbox";

                        updatedEmail.gmail_label =
                            "INBOX";

                        updatedEmail.is_gmail_spam =
                            false;

                    }

                }


                /*
                 * Keep scan result.
                 *
                 * We intentionally DO NOT remove
                 * allResults because the SVM result
                 * still belongs to this message.
                 */


                newEmailIds.delete(
                    String(id)
                );


                if (updatedEmail) {

                    updatedEmail.is_new = false;

                }


                newMailCount =
                    newEmailIds.size;


                updateNewMailIndicator();

                updateStatistics();

                renderResults();

                updateSectionCount();

                persistDashboard();


                showToast(
                    successMessage
                );


                /*
                 * Verify the real Gmail state
                 * shortly after the operation.
                 */

                setTimeout(
                    async () => {

                        if (!scanningAll) {

                            await ensureGmailInboxLoaded(
                                false
                            );

                        }

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Move email error:",
                    error
                );


                showToast(
                    "Move failed: " +
                    error.message
                );

            }

        }


        /* =========================================================
           NEW MAIL TOAST
        ========================================================= */

        function showNewMailToast(
            count
        ) {

            const message =
                count === 1
                    ? "New email received."
                    : `${count} new emails received.`;


            showToast(

            );

        /* =========================================================
           TOAST
        ========================================================= */

        function showToast(
            message,
            isNewMail = false
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            if (!toast) {

                return;

            }


            toast.textContent =
                message;


            toast.classList.toggle(
                "new-toast",
                isNewMail
            );


            toast.style.display =
                "block";


            clearTimeout(
                window.__toastTimer
            );


            window.__toastTimer =
                setTimeout(
                    () => {

                        toast.style.display =
                            "none";

                    },
                    3500
                );

        }


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================================
           ESCAPE JAVASCRIPT
        ========================================================= */

        function escapeJs(
            value
        ) {

            return String(
                value ?? ""
            )

                .replace(
                    /\\/g,
                    "\\\\"
                )

                .replace(
                    /'/g,
                    "\\'"
                )

                .replace(
                    /"/g,
                    '\\"'
                )

                .replace(
                    /\r?\n/g,
                    "\\n"
                );

        }

    </script>
